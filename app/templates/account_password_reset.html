<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nové heslo · Fresh AI Engine</title><link rel="icon" href="https://www.freshcrackers.cz/wp-content/uploads/2023/10/Fresh-Crackers-Logo.png"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/support.css?v=044"></head><body class="auth-body"><main class="auth-wrap"><section class="panel auth-card"><a class="auth-brand" href="/"><img src="https://www.freshcrackers.cz/wp-content/uploads/2023/10/Fresh-Crackers-Logo.png" alt="Fresh Crackers"></a><div class="auth-product">Fresh AI Engine</div>{% if ok %}<h1>Heslo změněno</h1><div class="notice">Nové heslo je uložené. Můžeš se přihlásit.</div><a class="button-link" href="/account/login">Přihlásit se</a>{% else %}<h1>Nastavit nové heslo</h1>{% if error %}<div class="notice warn">{{ error }}</div>{% endif %}<form method="post" class="stack"><input type="hidden" name="token" value="{{ token }}"><label>Nové heslo<div class="password-wrap"><input id="new-password" type="password" name="password" minlength="10" required autocomplete="new-password"><button type="button" class="show-pass" onclick="toggle('new-password',this)">Zobrazit</button></div></label><label>Zopakovat heslo<div class="password-wrap"><input id="new-password-2" type="password" name="password_confirm" minlength="10" required autocomplete="new-password"><button type="button" class="show-pass" onclick="toggle('new-password-2',this)">Zobrazit</button></div></label><button type="submit">Uložit nové heslo</button></form>{% endif %}</section></main><script>function toggle(id,b){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';b.textContent=e.type==='password'?'Zobrazit':'Skrýt';}</script>{% include 'support_widget.html' %}</body></html>
